name: ehliyet_hazirlik
description: "Ehliyet sınav hazırlık uygulaması — Flutter, Firebase, Supabase, Claude AI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Routing
  go_router: ^14.0.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.0.0
  firebase_remote_config: ^5.0.0

  # Auth
  google_sign_in: ^6.2.0

  # Backend & services
  supabase_flutter: ^2.0.0
  purchases_flutter: ^7.0.0

  # Media & UI
  youtube_player_flutter: ^9.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  google_fonts: ^6.2.0
  cached_network_image: ^3.3.0
  fl_chart: ^0.68.0

  # Notifications
  flutter_local_notifications: ^18.0.0

  # Utilities
  fpdart: ^1.1.0
  shared_preferences: ^2.3.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
